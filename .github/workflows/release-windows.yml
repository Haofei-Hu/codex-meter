name: Release Windows login detection fix
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-windows
  cancel-in-progress: false
jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
          cache: true
          cache_dependency_path: desktop/pnpm-lock.yaml
      - name: Install locked dependencies and official Windows runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm prepare:win
      - name: Test discovery, account changes, quotas and work records
        run: pnpm test
      - name: Verify the real runtime without a CLI installation or login
        run: pnpm test:runtime
      - name: Test the real Windows card, dragging and scaling
        run: |
          pnpm assets
          pnpm smoke
        env:
          CODEX_METER_SCREENSHOT: smoke-windows.png
      - name: Build setup and portable installers
        run: pnpm exec electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify the runtime from the final packaged app
        run: pnpm test:runtime
        env:
          CODEX_METER_TEST_RUNTIME: dist/win-unpacked/resources/codex
      - name: Verify installers and create checksums
        run: python scripts/windows-checksums.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-login-fix
          path: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-login-fix-screenshots
          path: desktop/smoke-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish tested Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          gh release create "v$version" dist/*.exe dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Codex Meter $version · Windows 登录识别修复" --notes-file "../docs/release-$version.md"
